name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        working-directory: client
        run: npm ci
      - name: Build
        working-directory: client
        env:
          # Project served from /group-gamble/ on GitHub Pages.
          GH_BASE: /group-gamble/
          # These are PUBLIC by design (publishable key + project URL are safe
          # to expose; Row Level Security protects the data). To rotate later,
          # move them to repo Secrets and reference ${{ secrets.NAME }} here.
          VITE_SUPABASE_URL: https://ixogmhrlvcrrefbmqmnj.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_CIsDAA599cOPQqvoPAZjTw_wpxo7h3U
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
